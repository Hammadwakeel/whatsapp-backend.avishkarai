# WAHA - WhatsApp HTTP API
# Production-ready open-source WhatsApp gateway
# Docs: https://waha.tech/docs

services:
  # WAHA - WhatsApp HTTP API Gateway
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "3001:3000"  # WAHA HTTP API port (3001 to avoid conflict with Next.js on 3000)
    environment:
      # Session settings
      - SESSIONS_DIR=/app/sessions
      - LOG_LEVEL=info

      # Webhook configuration - WAHA sends events here
      # Replace with your public URL in production
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_URL:-http://host.docker.internal:8000/webhook/whatsapp-waha}
      - WHATSAPP_HOOK_EVENTS_WEBHOOK=true
      - WHATSAPP_HOOK_EVENTS=onMessage,onStatus,onQr

      # Security
      - WHATSAPP_HOOK_URL_SECRET=  # Optional secret for webhook auth
      - WHATSAPP_SESSION_CONFIG_STORE_SECRETS=false

      # Debug (set to false in production)
      - DEBUG=false
    volumes:
      - waha-data:/app/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  waha-data:
    driver: local