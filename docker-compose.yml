services:
  # Main PostgreSQL database for Inika backend
  db:
    image: postgres:16-alpine
    container_name: inika-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inika_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Inika Backend API
  api:
    build: .
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://inika:inika123@db:5432/inika_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Match tenant UUID from /auth login response when multiple hotels share one backend
      - WEBHOOK_WHATSAPP_TENANT_ID=${WEBHOOK_WHATSAPP_TENANT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
